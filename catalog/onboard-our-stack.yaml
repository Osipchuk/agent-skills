# Catalog metadata for the onboard-our-stack skill.
# Read by scripts/generate_registry.py to build registry.json + catalog.json.
# This file is NEVER installed to a user — it lives outside skills/ so the
# installer (which copies skills/<name>/ verbatim) never sees it, and editing
# it never changes the skill's checksum.

summary: "Onboard a newcomer to your codebase or answer a targeted 'how does our X work' question by walking curated reading lists — and cold-starting from the repo's own docs when no curated config exists yet."
tags: [documentation, learning]
compatible_agents: [claude-code]
license: MIT

when: >-
  Fires when someone asks how the team's own system works — broad ("I'm new,
  walk me through this project", "where do I start") or targeted ("how does our
  scheduler work"). With a committed .claude/onboard/topics.yaml it walks the curated
  path; without one it cold-starts from README/ARCHITECTURE/CLAUDE.md/docs and
  is explicit about the curated gotchas still missing. The newcomer creates
  nothing and changes no code.

highlights:
  - "Works out of the box: a newcomer just asks — no config to create, no setup, no code changes. The config is a maintainer's one-time committed artifact."
  - "Cold-start fallback reads and CITES the repo's own docs rather than refusing; it never invents gotchas or guesses which files are load-bearing."
  - "Broad mode walks an ordered curriculum (why -> getting-started -> one request end-to-end -> deep topics); targeted mode walks a single subsystem."
  - "The keystone is request_lifecycle: one request narrated end-to-end across the layers — the story that actually hands over the mental model."
  - "Curated knowledge (load-bearing files, ordering, the gotchas only in people's heads) stays human-authored and PR-reviewed, guarded by a stdlib CI check."

example:
  title: "New hire: onboard me to this project"
  turns: 4
  tokens: 640
  caption: "A newcomer asks for a broad walkthrough; the committed config drives an ordered curriculum that opens with the why and the end-to-end request flow."
  trace_url: null
  input:
    - { kind: user, text: "I just joined and I'm looking at this repo for the first time. Where do I start?" }
  output:
    - { kind: anchor, text: "[onboard-our-stack] broad intent, curated config present, walking onboarding_path" }
    - { kind: tool, text: "read .claude/onboard/topics.yaml, then product_vision and request_lifecycle reading lists" }
    - { kind: tool_out, text: "onboarding_path: product_vision, getting_started, request_lifecycle, ..." }
    - { kind: assistant, text: "Let's go in order; I'll pause between each. First the why: this is an empathy-first chat companion, not a calorie tracker, and 'stay silent unless there's something worth saying' drives the UX. Next, getting it running locally (I'll read the runbook so the commands are current). Then the one story that ties it together: a meal message hits the webhook, middleware rehydrates your state from the DB, the handler calls the agent which runs a tool-call loop and reaches the DB only through the repository, then streams the reply back. One global landmine up front: ARCHITECTURE.md still says 'two LLM calls' — that's stale, trust the v2 agent. Want me to go deeper on the request flow before we hit the subsystems?" }
