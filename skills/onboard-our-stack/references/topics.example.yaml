# Copy this to `.onboard/topics.yaml` at your repo root and edit. A MAINTAINER
# authors this once and commits it; newcomers never create it. If it is absent,
# onboard-our-stack cold-starts from the repo's own docs instead of refusing.
#
# Two top-level keys:
#   onboarding_path: [topic_key, ...]   ordered curriculum for broad onboarding
#   topics: { <key>: {...}, ... }       the reading lists
#
# Each topic:
#   one_liner:      str   - the subsystem in one sentence; shown first
#   read_in_order:  [str] - load-bearing paths, IN the order they make sense
#   watch_out_for:  [str] - non-obvious gotchas (the highest-value field)
#   adrs:           [str] - (optional) ADR/spec paths for the "why"
#
# Two conventional special topics — put them early in onboarding_path:
#   getting_started   - POINTS AT the run/test docs (README, RUNBOOK) so the
#                       commands stay current; do not hardcode commands here.
#   request_lifecycle - traces ONE request end to end across the layers. The
#                       keystone: the single story that hands over the model.

onboarding_path:
  - product_vision
  - getting_started
  - request_lifecycle
  - architecture_layers
  - database

topics:
  product_vision:
    one_liner: "What this is and who it's for — the product principles that decide what gets built."
    read_in_order:
      - README.md
      - docs/PRODUCT.md
    watch_out_for:
      - "Read this BEFORE touching flows or prompts — tone and UX principles are requirements, not preferences."

  getting_started:
    one_liner: "Clone, install, configure, run locally, and run the tests."
    read_in_order:
      - README.md
      - docs/RUNBOOK.md
      - core/config.py
    watch_out_for:
      - "Commands live in the docs, not here — read them live so they don't drift."

  request_lifecycle:
    one_liner: "Follow one user request from the entry point to the response, across every layer it touches."
    read_in_order:
      - main.py
      - <middleware>
      - <handler>
      - <core service>
      - <repository or db layer>
    watch_out_for:
      - "Name the boundary each layer must not cross — that boundary IS the mental model."

  architecture_layers:
    one_liner: "The layered flow and the boundary rules between layers."
    read_in_order:
      - ARCHITECTURE.md
      - main.py
    watch_out_for:
      - "If a doc disagrees with the code, say which one to trust and why."

  database:
    one_liner: "The data model and the single allowed path to the DB."
    read_in_order:
      - db/models.py
      - db/repository.py
    watch_out_for:
      - "All CRUD funnels through the repository — a query elsewhere is a bug, not a pattern to copy."
