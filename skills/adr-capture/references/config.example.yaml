# Copy this to `.claude/adr/config.yaml` at your repo root and edit — or skip
# the file entirely to use the defaults baked into references/adr-template.md.
# A maintainer authors it once and commits it; adr-capture reads it before
# drafting.

adr_dir: docs/adr/            # where ADRs live; scanned for the next id
id_format: "NNNN"             # zero-padded width of the numeric id in filenames

# Headings every draft must carry. Any the conversation did not cover get a
# literal <TODO: ...> — the skill never invents their content.
mandatory_sections:
  - Regulatory impact
  - Data classification
  - Security review status
  - Rollback plan
